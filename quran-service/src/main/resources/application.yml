server:
  port: 8083
spring:
  application:
    name: quran-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sabeel_quran}
    username: ${DB_USER:sabeel}
    password: ${DB_PASS:sabeel}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
quran:
  seed:
    mode: ${QURAN_SEED_MODE:full}
  timings:
    dir: ${QURAN_TIMINGS_DIR:}
  reciters:
    file: ${QURAN_RECITERS_FILE:}
  audio:
    ayah-base-url: ${QURAN_AUDIO_AYAH_BASE_URL:}
    surah-base-url: ${QURAN_AUDIO_SURAH_BASE_URL:}
jwt:
  secret: ${JWT_SECRET:change-me-to-a-very-long-base64-secret-of-at-least-32-bytes}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8087
spring:
  application:
    name: prayer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sabeel_prayer}
    username: ${DB_USER:sabeel}
    password: ${DB_PASS:sabeel}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
jwt:
  secret: ${JWT_SECRET:change-me-to-a-very-long-base64-secret-of-at-least-32-bytes}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
prayer:
  reminder-cron: ${PRAYER_REMINDER_CRON:0 0 * * * *}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

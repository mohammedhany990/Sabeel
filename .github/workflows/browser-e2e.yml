name: browser-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/**
      - platform/tools/e2e/**
      - .github/workflows/browser-e2e.yml

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build services
        run: mvn -B -q package -DskipTests
      - name: Start the stack
        working-directory: platform
        run: |
          cp .env.example .env
          export COMPOSE_PARALLEL_LIMIT=2
          docker compose build
          docker builder prune -af
          docker compose up -d
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          sleep 30
      - name: Install Playwright
        working-directory: platform/tools/e2e
        run: |
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run browser checks
        working-directory: platform/tools/e2e
        run: node e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out
          path: platform/tools/e2e/e2e-out
      - name: Logs on failure
        if: failure()
        working-directory: platform
        run: docker compose logs --no-color --tail=100
      - name: Tear down
        if: always()
        working-directory: platform
        run: docker compose down -v

name: teaser-video-v2

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build services
        run: mvn -B -q package -DskipTests
      - name: Start the stack
        working-directory: platform
        run: |
          cp .env.example .env
          export COMPOSE_PARALLEL_LIMIT=2
          docker compose build
          docker builder prune -af
          docker compose up -d
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          sleep 30
      - name: Install Playwright
        working-directory: platform/tools/teaser
        run: |
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Record
        working-directory: platform/tools/teaser
        run: |
          python3 durations2.py
          node record2.mjs
          cat teaser-out/failures.txt || true
          python3 mux2.py teaser-out
          ffprobe -v error -show_entries format=duration -of csv=p=0 teaser-out/sabeel-teaser2.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: sabeel-teaser2
          path: |
            platform/tools/teaser/teaser-out/sabeel-teaser2.mp4
            platform/tools/teaser/teaser-out/failures.txt
            platform/tools/teaser/teaser-out/timeline2.json
            platform/tools/teaser/teaser-out/*.png
      - name: Logs on failure
        if: failure()
        working-directory: platform
        run: docker compose logs --no-color --tail=100
      - name: Recitation logs
        if: always()
        working-directory: platform
        run: docker compose logs --no-color --tail=40 recitation-service
      - name: Tear down
        if: always()
        working-directory: platform
        run: docker compose down -v

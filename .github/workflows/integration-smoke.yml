name: integration-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npx ng test --no-watch
      - name: Production build
        run: npx ng build --configuration production

  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build all services
        run: mvn -B -q package

      - name: Test the timings tool
        working-directory: platform/tools
        run: python3 -m unittest

      - name: Start the full stack
        working-directory: platform
        run: |
          cp .env.example .env
          export COMPOSE_PARALLEL_LIMIT=2
          docker compose build
          docker builder prune -af
          df -h /
          docker compose up -d

      - name: Run the smoke suite
        working-directory: platform
        run: ./scripts/smoke.sh

      - name: Run the smoke suite again on the same data
        working-directory: platform
        run: sleep 2 && ./scripts/smoke.sh

      - name: Collect service logs on failure
        if: failure()
        working-directory: platform
        run: |
          docker compose ps
          ./scripts/diag.sh || true
          curl -si --max-time 5 http://localhost:8080/actuator/health | head -c 800 || true
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        working-directory: platform
        run: docker compose down -v

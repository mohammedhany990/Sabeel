name: integration-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build all services
        run: |
          set -e
          for svc in api-gateway auth-service user-service quran-service memorization-service revision-service notification-service prayer-service azkar-service learning-service community-service recitation-service; do
            (cd "$svc" && mvn -B -q package)
          done

      - name: Start the full stack
        working-directory: platform
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Run the smoke suite
        working-directory: platform
        run: ./scripts/smoke.sh

      - name: Collect service logs on failure
        if: failure()
        working-directory: platform
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        working-directory: platform
        run: docker compose down -v
